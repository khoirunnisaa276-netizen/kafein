<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pengelola — Kafein</title>
  <meta name="description" content="Dashboard pengelola kafe untuk memperbarui status keramaian secara real-time.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="dash-main">
      <div class="stats">
        <div class="stat"><span class="meta">Pengunjung hari ini</span><b>128</b></div>
        <div class="stat"><span class="meta">Rating</span><b>★ 4.7</b></div>
        <div class="stat"><span class="meta">Disimpan pengguna</span><b>342</b></div>
      </div>
      <section class="dash-card">
        <h1 class="serif">Ubah Status Keramaian</h1>
        <p class="meta">Perbarui kondisi kafe kamu (<b id="cafeName"></b>) secara real-time.</p>
        <div class="status-grid" id="statusGrid"></div>
        <p class="meta">Status saat ini</p>
        <div style="margin:6px 0 20px" id="current"></div>
        <label for="note" style="font-weight:600">Catatan (opsional)</label>
        <textarea id="note" placeholder="Contoh: Tempat duduk terbatas di area indoor."></textarea>
        <button class="btn btn-primary btn-block" id="btnSave" style="margin-top:18px">Simpan Perubahan</button>
        <a href="detail.html?id=5" class="btn btn-outline btn-block" style="margin-top:10px" id="btnPreview">Lihat halaman publik</a>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    const cafe = CAFES.find(c => c.id === 5);
    const ic = {
      home: ICON.home, edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
      data: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>',
      chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
      out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>'
    };
    $('#sidebar').innerHTML = `<a href="index.html" class="logo">${ICON.logo}Kafein</a>` +
      [['home', 'Dashboard'], ['edit', 'Ubah Status', 1], ['data', 'Data Kafe'], ['chat', 'Ulasan'], [null, 'Profil']].map(([i, t, a]) =>
        `<div class="side-link ${a ? 'active' : ''}">${i ? ic[i] : ICON.user}<span>${t}</span></div>`).join('') +
      `<a href="index.html" class="side-link out">${ic.out}<span>Keluar</span></a>`;
    $('#cafeName').textContent = cafe.name;

    const faces = { sepi: '☺', sedang: '◔', ramai: '◑', penuh: '●' };
    let selected = cafe.status;
    $('#statusGrid').innerHTML = Object.entries(STATUS).map(([k, s]) =>
      `<button class="status-btn ${k}" data-s="${k}"><span class="ic">${faces[k]}</span>${s.label}</button>`).join('');
    const sync = () => $$('.status-btn').forEach(b => b.classList.toggle('selected', b.dataset.s === selected));
    const showCurrent = () => $('#current').innerHTML = `${badge(cafe.status)} <span class="meta">${updatedText(cafe.updated)}</span>`;
    $$('.status-btn').forEach(b => b.onclick = () => { selected = b.dataset.s; sync(); });
    $('#btnSave').onclick = () => {
      const o = readStatusOverrides();
      o[cafe.id] = { status: selected, time: Date.now(), note: $('#note').value };
      const ok = writeStorage('kafein_status', o);
      if (!ok) {
        toast('Tidak bisa menyimpan status di browser ini');
        return;
      }
      cafe.status = selected; cafe.updated = 0; showCurrent();
      toast(`Status diperbarui menjadi "${STATUS[selected].label}" ✓`);
    };
    sync(); showCurrent();
  </script>
</body>
</html>
